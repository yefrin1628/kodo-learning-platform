<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0B1020">
<title>KODO — Aprende programación e idiomas jugando</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236C5CE7'/%3E%3Cstop offset='1' stop-color='%2300C2FF'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='2' y='2' width='44' height='44' rx='13' fill='url(%23g)'/%3E%3Cpath d='M15 12v24M15 24l13-12M16 23l14 13' stroke='%23fff' stroke-width='5' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3Ccircle cx='34' cy='11' r='3.4' fill='%23FFC700'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/manrope@5/latin-400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/manrope@5/latin-600.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/manrope@5/latin-700.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/manrope@5/latin-800.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/jetbrains-mono@5/latin-400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/jetbrains-mono@5/latin-600.css">
<style>
:root{--bg:#0B1020;--s1:#121A2F;--s2:#1A2440;--s3:#22304F;--bd:rgba(255,255,255,.08);--bd2:rgba(255,255,255,.14);--p:#6C5CE7;--s:#00C2FF;--ok:#22C55E;--en:#FFC700;--err:#EF4444;--t:#FFFFFF;--t2:#A7B0C3;--grad:linear-gradient(135deg,var(--p),var(--s));--r:20px}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{font-family:'Manrope',system-ui,sans-serif;background:var(--bg);color:var(--t);font-size:16px;line-height:1.55;overflow-x:hidden}
::selection{background:rgba(108,92,231,.5)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#26314f;border-radius:8px}
button{font-family:inherit;color:inherit}
img{user-select:none}
h1,h2,h3{line-height:1.15;letter-spacing:-.02em}
.mono{font-family:'JetBrains Mono',monospace}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:14px;font-weight:800;cursor:pointer;transition:transform .12s,box-shadow .12s,filter .12s;padding:0 22px;height:48px;font-size:15px;white-space:nowrap}
.btn:active{transform:scale(.96)}
.btn-p{background:var(--grad);color:#fff;box-shadow:0 8px 24px -8px rgba(108,92,231,.65)}
.btn-p:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn-c{background:var(--s);color:#04141a;box-shadow:0 8px 24px -10px rgba(0,194,255,.55)}
.btn-ok{background:var(--ok);color:#04140a;box-shadow:0 8px 24px -10px rgba(34,197,94,.6)}
.btn-err{background:rgba(239,68,68,.15);color:#fca5a5;border:1px solid rgba(239,68,68,.4)}
.btn-ghost{background:var(--s1);border:1px solid var(--bd2);color:var(--t)}
.btn-ghost:hover{background:var(--s2)}
.btn[disabled]{background:var(--s2);color:#5b6784;box-shadow:none;cursor:not-allowed;transform:none}
.btn.big{height:56px;font-size:16px;border-radius:16px;padding:0 32px}
.btn.sm{height:38px;padding:0 16px;font-size:13px;border-radius:11px}
.w100{width:100%}
.grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);transition:border-color .2s,transform .2s}
.glass{background:rgba(18,26,47,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;padding:5px 12px;border-radius:999px;background:var(--s2);color:var(--t2);border:1px solid var(--bd)}
.tag.p{background:rgba(108,92,231,.16);color:#c4b5fd;border-color:rgba(108,92,231,.35)}
.tag.c{background:rgba(0,194,255,.12);color:#7ddcff;border-color:rgba(0,194,255,.3)}
.tag.g{background:rgba(34,197,94,.12);color:#86efac;border-color:rgba(34,197,94,.3)}
.tag.y{background:rgba(255,199,0,.12);color:#ffe08a;border-color:rgba(255,199,0,.3)}
.pbar{height:10px;background:var(--s2);border-radius:99px;overflow:hidden}
.pbar>div{height:100%;background:var(--grad);border-radius:99px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.pbar.ok>div{background:var(--ok)}.pbar.en>div{background:var(--en)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:400;overflow:hidden}
#fx i{position:absolute;top:-24px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(760deg)}}
#floats{position:fixed;inset:0;pointer-events:none;z-index:410}
.xpf{position:fixed;transform:translate(-50%,0);font-weight:800;font-size:22px;color:var(--en);text-shadow:0 4px 18px rgba(255,199,0,.5);animation:rise 1.3s ease forwards}
@keyframes rise{from{opacity:0;transform:translate(-50%,10px) scale(.8)}20%{opacity:1;transform:translate(-50%,0) scale(1.05)}to{opacity:0;transform:translate(-50%,-90px) scale(1)}}
#toasts{position:fixed;top:18px;right:18px;z-index:420;display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.toast{background:var(--s2);border:1px solid var(--bd2);border-radius:14px;padding:12px 18px;font-weight:700;font-size:14px;box-shadow:0 12px 40px rgba(0,0,0,.5);animation:tin .3s cubic-bezier(.2,.9,.3,1.3);max-width:340px}
@keyframes tin{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(108,92,231,.5)}70%{box-shadow:0 0 0 14px rgba(108,92,231,0)}}
.l-nav{position:sticky;top:12px;z-index:50;display:flex;align-items:center;gap:14px;max-width:1180px;margin:14px auto 0;padding:12px 20px;border-radius:18px;border:1px solid var(--bd)}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;letter-spacing:.06em;cursor:pointer}
.logo svg{width:36px;height:36px;filter:drop-shadow(0 4px 14px rgba(108,92,231,.5))}
.l-links{display:flex;gap:4px;margin-left:auto}
.l-links a{color:var(--t2);font-weight:700;font-size:14px;padding:8px 14px;border-radius:10px;cursor:pointer;text-decoration:none}
.l-links a:hover{color:var(--t);background:var(--s2)}
.hero{max-width:1180px;margin:0 auto;padding:70px 24px 40px;display:grid;grid-template-columns:1.05fr .95fr;gap:50px;align-items:center}
.hero-badge{display:inline-flex;gap:8px;align-items:center;background:rgba(0,194,255,.1);border:1px solid rgba(0,194,255,.3);color:#7ddcff;border-radius:999px;padding:7px 16px;font-weight:800;font-size:13px;margin-bottom:22px}
.hero h1{font-size:clamp(34px,4.6vw,58px);font-weight:800}
.hero p{color:var(--t2);font-size:18px;margin:20px 0 30px;max-width:520px}
.hero-cta{display:flex;gap:14px;flex-wrap:wrap}
.hero-stats{display:flex;gap:26px;margin-top:38px;flex-wrap:wrap}
.hst b{font-size:22px;display:block}.hst span{color:var(--t2);font-size:13px;font-weight:700}
.hero-right{position:relative}
.mock{position:relative;height:480px}
.mock .mascot{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:280px;animation:floaty 4s ease-in-out infinite;filter:drop-shadow(0 20px 60px rgba(108,92,231,.45))}
.mock-card{position:absolute;background:rgba(18,26,47,.85);backdrop-filter:blur(10px);border:1px solid var(--bd2);border-radius:16px;padding:14px 18px;box-shadow:0 20px 60px rgba(0,0,0,.45);animation:floaty 5s ease-in-out infinite}
.mc1{top:6%;left:0}.mc2{bottom:10%;left:2%;animation-delay:1.1s}.mc3{top:14%;right:0;animation-delay:.8s}.mc4{bottom:4%;right:4%;animation-delay:.2s}
.mc-st{display:flex;gap:16px}.mc-st div{display:flex;align-items:center;gap:7px;font-weight:800;font-size:15px}
.mc-code{font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.8;color:#E6EDF7}
.tkk{color:#C4B5FD}.tks{color:#86EFAC}.tkn{color:#FFC700}.tkc{color:#64748B}.tkt{color:#7DDCFF}
.glow{position:absolute;width:420px;height:420px;border-radius:50%;filter:blur(120px);opacity:.35;pointer-events:none}
.sec{max-width:1180px;margin:0 auto;padding:70px 24px}
.sec h2{font-size:clamp(26px,3vw,40px);font-weight:800;text-align:center}
.sec .sub{color:var(--t2);text-align:center;margin:14px auto 44px;max-width:640px;font-size:17px}
.band{max-width:1180px;margin:0 auto;padding:0 24px}
.band-in{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;background:linear-gradient(135deg,rgba(108,92,231,.12),rgba(0,194,255,.08));border:1px solid var(--bd);border-radius:24px;padding:28px}
.bstat{text-align:center}
.bstat b{font-size:clamp(22px,3vw,34px);font-weight:800;display:block}
.bstat span{color:var(--t2);font-weight:700;font-size:13px}
.method{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.mth{padding:28px;position:relative}
.mth .num{position:absolute;top:16px;right:22px;font-size:46px;font-weight:800;color:rgba(255,255,255,.07)}
.mth .ic{font-size:32px;margin-bottom:14px}
.mth h3{font-size:19px;margin-bottom:10px}
.mth p{color:var(--t2);font-size:14px;margin-bottom:14px}
.mth ul{list-style:none;display:grid;gap:8px}
.mth li{color:var(--t2);font-size:13.5px;font-weight:600}
.mth li::before{content:'✓ ';color:var(--ok);font-weight:800}
.strip{display:flex;gap:14px;overflow-x:auto;padding:6px 4px 18px;scrollbar-width:thin}
.ctile{min-width:150px;padding:20px 16px;display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;text-align:center}
.ctile .ci2{width:64px;height:64px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:#0B1020}
.ctile .ci2.flag{background:var(--s3);color:#fff;font-size:30px}
.ctile b{font-size:14px}
.ctile span{color:var(--t2);font-size:12px;font-weight:700}
.ctile:hover{transform:translateY(-3px);border-color:var(--bd2)}
.deep{display:grid;grid-template-columns:1fr 1fr;gap:44px;align-items:center;margin-bottom:64px}
.deep.rev .dvis{order:-1}
.dtxt h3{font-size:clamp(22px,2.6vw,30px);margin-bottom:14px;text-align:left}
.dtxt p{color:var(--t2);margin-bottom:18px}
.dtxt ul{list-style:none;display:grid;gap:10px;margin-bottom:22px}
.dtxt li{font-weight:700;font-size:14.5px;color:var(--t2)}
.dtxt li b{color:var(--t)}
.dvis .card{padding:18px}
.testi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.testi{padding:24px}
.testi .stars{color:var(--en);letter-spacing:2px;margin-bottom:12px}
.testi p{font-size:14.5px;color:var(--t2);margin-bottom:16px;font-weight:600}
.testi .who{display:flex;gap:12px;align-items:center}
.testi .av{width:44px;height:44px;border-radius:50%;background:var(--s3);display:flex;align-items:center;justify-content:center;font-size:22px}
.testi b{font-size:14px}
.testi span{display:block;color:var(--t2);font-size:12px;font-weight:700}
.cta-band{max-width:1180px;margin:0 auto;padding:0 24px 70px}
.cta-in{border-radius:28px;padding:44px;display:flex;align-items:center;gap:30px;justify-content:space-between;background:var(--grad);position:relative;overflow:hidden}
.cta-in h2{font-size:clamp(24px,3vw,36px);color:#fff}
.cta-in p{color:rgba(255,255,255,.88);font-weight:700;margin-top:8px}
.cta-in img{width:190px;filter:drop-shadow(0 14px 30px rgba(0,0,0,.35));animation:floaty 3.5s infinite}
footer.footer{border-top:1px solid var(--bd);margin-top:20px;text-align:left;padding:0}
.f-in{max-width:1180px;margin:0 auto;padding:44px 24px;display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr 1fr;gap:28px}
.f-col h4{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--t2);margin-bottom:14px}
.f-col a{display:block;color:var(--t2);font-weight:700;font-size:14px;padding:5px 0;cursor:pointer;text-decoration:none}
.f-col a:hover{color:var(--t)}
.f-bot{max-width:1180px;margin:0 auto;padding:18px 24px 30px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;color:var(--t2);font-size:13px;font-weight:600;border-top:1px solid var(--bd)}
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;max-width:860px;margin:0 auto}
.cat-card{padding:28px;position:relative;overflow:hidden}
.cat-card::before{content:'';position:absolute;inset:0;background:radial-gradient(400px 200px at 0% 0%,var(--cc,rgba(108,92,231,.18)),transparent 70%)}
.cat-card h3{font-size:20px;margin:14px 0 6px;position:relative}
.cat-card p{color:var(--t2);font-size:14px;position:relative;margin-bottom:16px}
.cat-ic{font-size:34px;position:relative}
.chips{display:flex;flex-wrap:wrap;gap:8px;position:relative}
.feat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.feat{padding:24px}.feat .ic{font-size:30px;margin-bottom:14px}
.feat h3{font-size:16px;margin-bottom:8px}.feat p{color:var(--t2);font-size:13.5px}
.how-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.how{padding:28px;text-align:center}
.how .n{width:44px;height:44px;border-radius:14px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;margin:0 auto 16px}
.pro-card{max-width:760px;margin:0 auto;padding:40px;display:grid;grid-template-columns:auto 1fr auto;gap:30px;align-items:center;border:1px solid rgba(255,199,0,.35);background:linear-gradient(135deg,rgba(255,199,0,.08),rgba(108,92,231,.1))}
.pro-card .ic{font-size:56px}
.pro-card h3{font-size:24px}
.pro-card ul{list-style:none;margin-top:12px;display:grid;gap:8px}
.pro-card li{color:var(--t2);font-weight:600;font-size:14.5px}
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;position:relative}
.auth-card{width:100%;max-width:440px;padding:36px;position:relative;z-index:2}
.auth-card h2{font-size:26px;margin:18px 0 8px}
.auth-card .sub{color:var(--t2);margin-bottom:26px}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:800;color:var(--t2);margin-bottom:8px}
.field input{width:100%;background:var(--s2);border:1px solid var(--bd2);border-radius:13px;padding:14px 16px;color:var(--t);font-family:inherit;font-size:15px;font-weight:600;outline:none;transition:border .2s}
.field input:focus{border-color:var(--p)}
.ob-wrap{min-height:100vh;max-width:760px;margin:0 auto;padding:40px 24px;display:flex;flex-direction:column}
.ob-top{display:flex;align-items:center;gap:16px;margin-bottom:40px}
.ob-x{background:none;border:none;color:var(--t2);font-size:20px;cursor:pointer}
.ob-dots{flex:1;display:flex;gap:8px}
.ob-dots i{height:8px;flex:1;background:var(--s2);border-radius:99px;transition:background .3s}
.ob-dots i.on{background:var(--grad)}
.ob-q{font-size:clamp(24px,3.4vw,34px);font-weight:800;margin-bottom:30px}
.ob-opts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ob-opt{display:flex;align-items:center;gap:16px;padding:18px 20px;background:var(--s1);border:2px solid var(--bd);border-radius:16px;cursor:pointer;font-weight:700;font-size:16px;text-align:left;transition:all .15s}
.ob-opt:hover{border-color:var(--bd2);transform:translateY(-2px)}
.ob-opt .ic{font-size:28px}
.ob-opt small{display:block;color:var(--t2);font-weight:600;font-size:13px}
.ob-rec{display:flex;flex-direction:column;align-items:center;text-align:center;gap:18px;padding:20px 0}
.ob-rec img{width:220px;animation:floaty 3.5s ease-in-out infinite}
.ob-rec h2{font-size:30px}
.ob-rec p{color:var(--t2);max-width:480px}
.rec-cards{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin:8px 0}
.shell{display:flex;max-width:1280px;margin:0 auto;min-height:100vh}
.side{width:250px;position:sticky;top:0;height:100vh;padding:22px 16px;border-right:1px solid var(--bd);display:flex;flex-direction:column;gap:6px;flex-shrink:0}
.snav{display:flex;align-items:center;gap:14px;padding:13px 16px;border-radius:14px;font-weight:800;font-size:14.5px;color:var(--t2);cursor:pointer;border:1px solid transparent;background:none;text-align:left;transition:all .15s}
.snav:hover{background:var(--s1);color:var(--t)}
.snav.on{background:rgba(108,92,231,.14);color:#c4b5fd;border-color:rgba(108,92,231,.35)}
.snav svg{flex-shrink:0}
.side-user{margin-top:auto;display:flex;gap:12px;align-items:center;padding:12px;border-radius:16px;background:var(--s1);border:1px solid var(--bd);cursor:pointer}
.side-user img{width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid var(--p)}
.side-user b{display:block;font-size:14px}
.side-user span{color:var(--t2);font-size:12px;font-weight:700}
.content{flex:1;min-width:0;padding:28px 32px 90px}
.bnav{position:fixed;bottom:0;left:0;right:0;z-index:60;display:none;justify-content:space-around;padding:10px 8px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--bd)}
.bnav button{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;color:var(--t2);font-size:10.5px;font-weight:800;cursor:pointer;padding:4px 10px;border-radius:12px}
.bnav button.on{color:#c4b5fd}
.dash-head{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin-bottom:24px}
.dash-head h1{font-size:clamp(24px,3vw,32px);font-weight:800}
.dash-head p{color:var(--t2);font-weight:600}
.mascot-box{position:relative;width:96px;height:96px;flex-shrink:0}
.mascot-box img{width:96px;height:96px;object-fit:cover;border-radius:28px;border:2px solid var(--bd2)}
.mascot-box .acc{position:absolute;left:50%;transform:translateX(-50%);pointer-events:none;filter:drop-shadow(0 2px 6px rgba(0,0,0,.5))}
.acc.glasses{top:36%;font-size:30px}.acc.headphones{top:-14px;font-size:34px}.acc.crown{top:-20px;font-size:32px}
.stat-row{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px}
.stat{padding:16px;display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.stat .v{font-size:21px;font-weight:800;display:flex;align-items:center;gap:8px}
.stat .l{color:var(--t2);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.dash-grid{display:grid;grid-template-columns:1.55fr 1fr;gap:20px;align-items:start}
.cont-card{padding:26px;position:relative;overflow:hidden}
.cont-card::before{content:'';position:absolute;inset:0;background:radial-gradient(500px 220px at 100% 0%,rgba(0,194,255,.14),transparent 70%)}
.cont-card .cc-l{color:var(--t2);font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.08em}
.cont-card h3{font-size:22px;margin:8px 0 4px;position:relative}
.cont-card .meta{color:var(--t2);font-weight:700;font-size:14px;margin-bottom:18px;position:relative}
.ring-wrap{display:flex;align-items:center;gap:18px}
.ring{transform:rotate(-90deg)}
.ring .rbg{stroke:var(--s2)}
.ring .rfg{stroke:var(--en);stroke-linecap:round;transition:stroke-dashoffset .6s}
.week{display:flex;gap:8px;margin-top:16px}
.wd{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;font-weight:800;color:var(--t2)}

function lvlIndex(){let i=0;for(let k=0;k<LEVELS.length;k++){if(U.xp>=LEVELS[k][1])i=k;}return i;}
function flatLessons(c){return c.modules.flatMap(m=>m.lessons);}
function findModule(cid,lid){const c=COURSES.find(x=>x.id===cid);return c?c.modules.find(m=>m.lessons.includes(lid)):null;}
function isUnlocked(cid,lid){const c=COURSES.find(x=>x.id===cid);const flat=flatLessons(c);const i=flat.indexOf(lid);
 return i===0||!!U.done[flat[i-1]];}
function coursePct(c){const f=flatLessons(c);if(!f.length)return 0;return Math.round(100*f.filter(l=>U.done[l]).length/f.length);}
function courseXP(c){let x=500;const f=flatLessons(c);f.forEach(l=>{x+=20+LESSONS[l].ex.length*5;});x+=c.modules.length*50;return x;}
function pathOrder(){const pref=U.onb?U.onb.learn:'both';
 const code=COURSES.filter(c=>c.cat==='code'),lang=COURSES.filter(c=>c.cat==='lang');
 return pref==='code'?[...code,...lang]:pref==='lang'?[...lang,...code]:[code[0],lang[0],...code.slice(1),...lang.slice(1)];}
function findNext(){for(const c of pathOrder()){const f=flatLessons(c);for(const l of f){if(!U.done[l]&&isUnlocked(c.id,l))return{c:c,lid:l};}}return null;}
function nextAfter(cid,lid){const c=COURSES.find(x=>x.id===cid);const f=flatLessons(c);const i=f.indexOf(lid);
 return i>=0&&i<f.length-1?f[i+1]:null;}

function hl(code,lang){let s=esc(code);

 s=s.replace(/("[^"]*"|'[^']*')/g,'<span class="tks">$1</span>');

 if(lang==='html'){s=s.replace(/(&lt;\/?)([\w-]+)/g,'$1<span class="tkt">$2</span>');}
 else if(kw){s=s.replace(new RegExp('\\b('+kw+')\\b','g'),'<span class="tkk">$1</span>');}

function buy(id){
 const it=SHOP.find(x=>x.id===id);if(!it)return;
 if(['glasses','headphones','crown','badge','theme-cyan','theme-sunset'].includes(id)&&U.items.includes(id)){toast('Ya lo tienes.');return;}
 if(it.id==='hearts'&&U.hearts>=5){toast('Tus vidas ya están llenas.');return;}
 if(U.gems<it.price){sBad();toast('💎 Te faltan '+(it.price-U.gems)+' gemas. ¡Sigue aprendiendo!');return;}
 U.gems-=it.price;
 if(id==='hearts')U.hearts=5;
 else if(id==='shield')U.shield=(U.shield||0)+1;
 else if(id==='boost')U.flags.boostNext=true;
 else if(id==='theme-cyan'){U.theme='#00C2FF';U.items.push(id);}
 else if(id==='theme-sunset'){U.theme='#FF6B6B';U.items.push(id);}
 else if(id==='theme-violet'){U.theme=null;}
 else{U.items.push(id);if(U.equip.hasOwnProperty(id))U.equip[id]=true;}
 saveU();checkAch();sGood();confetti(60);toast('🛍️ ¡Compraste <b>'+it.name+'</b>!');render();}

function openLesson(cid,lid){
 if(!U){go('auth');return;}
 if(!isUnlocked(cid,lid)){toast('🔒 Completa la lección anterior.');return;}
 const L=LESSONS[lid];
 const boost=!!U.flags.boostNext;
 if(boost)U.flags.boostNext=false;
 LS={mode:'lesson',cid:cid,lid:lid,ex:L.ex,step:-1,ok:0,bad:0,totalXP:0,answered:false,sel:null,typed:'',picks:[],bank:[],finished:false,resume:null,code:'',out:null,busy:false,boostApplied:boost};
 saveU();startTimer();$('#lesson-root').hidden=false;renderLS();}
function startPractice(resume){
 if(!U){go('auth');return;}
 LS={mode:'practice',cid:null,lid:null,ex:sample(poolEx(),3),step:-1,ok:0,bad:0,totalXP:0,answered:false,sel:null,typed:'',picks:[],bank:[],finished:false,resume:resume||null,code:'',out:null,busy:false,boostApplied:false};

 $('#bank').innerHTML=LS.bank.map((w,j)=>'<button class="wchip" data-j="'+j+'" onclick="lsPick('+j+')">'+esc(w)+'</button>').join('');
 renderAnsline();}
function lsPick(j){if(LS.answered)return;sClick();const b=document.querySelector('.wchip[data-j="'+j+'"]');if(!b||b.classList.contains('used'))return;b.classList.add('used');LS.picks.push(j);renderAnsline();lsCheckState();}
function renderAnsline(){const line=$('#ansline');if(!line)return;line.innerHTML='';
 LS.picks.forEach((j,pos)=>{const w=document.createElement('button');w.className='wchip';w.textContent=LS.bank[j];
  w.onclick=function(){if(LS.answered)return;sClick();LS.picks.splice(pos,1);const b=document.querySelector('.wchip[data-j="'+j+'"]');if(b)b.classList.remove('used');renderAnsline();lsCheckState();};
  line.appendChild(w);});}
function lsCheckState(){const cb=$('#lscheck');if(!cb)return;const ex=LS.ex[LS.step];let ok=false;
 if(ex.t==='choice'||ex.t==='tf'||ex.t==='fill'||ex.t==='bug')ok=LS.sel!=null;
 else if(ex.t==='type')ok=(LS.typed||'').trim().length>0;
 else if(ex.t==='tr')ok=LS.picks.length>0;
 else if(ex.t==='run')ok=(LS.code||'').trim().length>0&&!LS.busy;
 cb.disabled=!ok;}
function edClear(){if(LS.answered)return;LS.code='';const ta=$('#edcode');if(ta)ta.value='';LS.out=null;const o=$('#edout');if(o)o.innerHTML='<span style="color:#5b6784">› Consola limpia.</span>';lsCheckState();}
function edRun(){if(LS.busy)return;LS.busy=true;const o=$('#edout');if(o)o.innerHTML='<span style="color:#5b6784">› Ejecutando…</span>';
 execCode(LS.code,function(res){LS.busy=false;LS.out=res;
  if(!res.timeout&&!res.error)registerRun();
  if(LS.step>=0&&!LS.finished&&LS.ex[LS.step].t==='run')renderLS();});}
function lsCheck(){
 if(!LS||LS.answered||LS.finished)return;
 const ex=LS.ex[LS.step];
 if(ex.t==='run'){
  if(!(LS.code||'').trim()){toast('Escribe algo de código primero.');return;}
  LS.busy=true;const cb0=$('#lscheck');if(cb0)cb0.disabled=true;
  const o=$('#edout');if(o)o.innerHTML='<span style="color:#5b6784">› Ejecutando…</span>';
  execCode(LS.code,function(res){LS.busy=false;LS.out=res;
   if(!res.timeout&&!res.error)registerRun();
   if(res.timeout){lsFail('Tiempo agotado: revisa posibles bucles infinitos.',ex.e||'');return;}
   if(res.error){lsFail('Error en tu código: '+res.error,ex.e||'');return;}
   const code=LS.code;
   for(const m of ex.must||[]){if(code.indexOf(m)===-1){lsFail('Tu código debe incluir: '+m,ex.e||'');return;}}
   const lines=res.out.map(l=>l.trim());
   for(const expK of ex.expect||[]){const want=expK.trim().toLowerCase();
    if(!lines.some(l=>l.toLowerCase()===want)){lsFail('La consola debe imprimir exactamente: "'+expK+'"',ex.e||'');return;}}
   lsWinRun(ex);});
  return;}
 let ok=false,ans='';
 if(ex.t==='choice'){ok=LS.sel===ex.a;ans=ex.o[ex.a];}
 else if(ex.t==='tf'){ok=(LS.sel===0)===ex.a;ans=ex.a?'Verdadero':'Falso';}
 else if(ex.t==='fill'){ok=LS.sel===ex.a;ans=ex.o[ex.a];}
 else if(ex.t==='bug'){ok=LS.sel===ex.a;ans=ex.o[ex.a];}
 else if(ex.t==='type'){const v=norm(LS.typed);ok=ex.acc.some(a=>norm(a)===v);ans=ex.acc[0];}
 else if(ex.t==='tr'){const built=LS.picks.map(j=>LS.bank[j]).join(' ');ok=built===ex.ans;ans=ex.ans;}
 markOpts(ex,ok);
 resolve(ok,ans,ex.e||'');}
function markOpts(ex,ok){
 document.querySelectorAll('.lopt').forEach((el,i)=>{
  const isAns=(ex.t==='tf')?(i===0)===ex.a:i===ex.a;
  if(isAns&&!ok)el.classList.add('good');
  if(i===LS.sel)el.classList.add(ok?'good':'bad');});}
function lsWinRun(ex){LS.answered=true;LS.ok++;sGood();gainXP(5*lessonMult());countExercise();
 $('#lesson-root').querySelector('.ls-bottom').innerHTML=fbHTML(true,'¡Código correcto!',ex.e||'');afterAnswer(true);}
function lsFail(msg,expl){LS.answered=true;LS.bad++;sBad();
 if(LS.mode==='lesson'&&!U.pro){U.hearts=Math.max(0,U.hearts-1);saveU();}
 if(LS.ex[LS.step].t==='run')renderLS();
 $('#lesson-root').querySelector('.ls-bottom').innerHTML=fbHTML(false,msg,expl);afterAnswer(false);}
function resolve(ok,ans,expl){
 LS.answered=true;
 if(ok){LS.ok++;sGood();gainXP(5*lessonMult());}
 else{LS.bad++;sBad();if(LS.mode==='lesson'&&!U.pro){U.hearts=Math.max(0,U.hearts-1);saveU();}}
 countExercise();
 $('#lesson-root').querySelector('.ls-bottom').innerHTML=fbHTML(ok,ans,expl);
 afterAnswer(ok);}
function afterAnswer(ok){
 const top=$('#lesson-root').querySelector('.ls-hearts');
 if(top&&LS.mode==='lesson'&&!U.pro)top.innerHTML='❤️ '+U.hearts;
 checkChallenges();checkAch();saveU();}
function fbHTML(ok,title,expl){
 const badHead=/^(Error|Tiempo|Tu código|La consola)/.test(title)?title:'Respuesta correcta: '+esc(title);
 return '<div class="fb '+(ok?'ok':'bad')+'"><div class="msg"><div class="fico">'+(ok?'✓':'✕')+'</div><div><h4>'+(ok?(title||'¡Excelente!'):badHead)+'</h4><p>'+expl+(ok&&lessonMult()>1?' · <b style="color:var(--en)">XP x'+lessonMult()+'</b>':'')+'</p></div></div><button class="btn '+(ok?'btn-ok':'btn-err')+'" onclick="lsNext()">CONTINUAR</button></div>';}
function lsNext(){
 if(LS.finished){
  if(LS.resume){const prev=LS.resume;LS=prev;LS.answered=false;LS.sel=null;LS.picks=[];renderLS();return;}
  lsClose();return;}
 if(LS.mode==='lesson'&&!U.pro&&U.hearts<=0){openHearts();return;}
 LS.step++;LS.answered=false;LS.sel=null;LS.typed='';LS.picks=[];
 if(LS.step>=LS.ex.length)lsFinish();else renderLS();}
function lsFinish(){
 LS.finished=true;stopTimer();saveU();
 const acc=Math.round(100*LS.ok/(LS.ok+LS.bad||1));
 if(LS.mode==='lesson'){
  gainXP(20*lessonMult());
  U.gems+=5+(LS.bad===0?2:0);
  if(LS.bad===0){U.flags.perfect=true;U.day.perfect++;}
  U.done[LS.lid]={acc:acc,perfect:LS.bad===0,ts:Date.now()};
  U.day.lessons++;
  markActive();
  const mod=findModule(LS.cid,LS.lid);
  if(mod&&mod.lessons.every(l=>U.done[l])&&!U.flags['mod-'+mod.id]){U.flags['mod-'+mod.id]=true;gainXP(50*lessonMult());pending.push({type:'module',title:mod.title});}
  const c=COURSES.find(x=>x.id===LS.cid);
  if(c&&flatLessons(c).every(l=>U.done[l])&&!U.flags['course-'+LS.cid]){U.flags['course-'+LS.cid]=true;gainXP(500*lessonMult());pending.push({type:'course',c:c});}
  saveU();checkAch();checkChallenges();confetti(150);sWin();
 }else{
  gainXP(10);U.hearts=Math.min(5,U.hearts+1);U.gems+=2;saveU();sGood();}
 renderLS();}
function lsEndHTML(){
 const acc=Math.round(100*LS.ok/(LS.ok+LS.bad||1));
 if(LS.mode==='practice'){
  return '<div class="ls-body"><div class="ls-end"><img src="'+M_CELEB+'" alt=""><h1>¡Práctica completa!</h1><div class="end-cards"><div class="ec" style="--c:var(--en)"><span class="t">XP</span><span class="v">+'+LS.totalXP+'</span></div><div class="ec" style="--c:var(--ok)"><span class="t">Precisión</span><span class="v">'+acc+'%</span></div><div class="ec" style="--c:var(--err)"><span class="t">Vidas</span><span class="v">+1 ❤️</span></div></div><button class="btn btn-p big" onclick="lsNext()">CONTINUAR</button></div></div>';}
 const nxt=nextAfter(LS.cid,LS.lid);
 return '<div class="ls-body"><div class="ls-end"><img src="'+M_CELEB+'" alt=""><h1>'+(LS.bad===0?'¡LECCIÓN PERFECTA!':'¡LECCIÓN COMPLETADA!')+'</h1><div class="end-cards"><div class="ec" style="--c:var(--en)"><span class="t">XP ganados</span><span class="v">+'+LS.totalXP+'</span></div><div class="ec" style="--c:var(--ok)"><span class="t">Precisión</span><span class="v">'+acc+'%</span></div><div class="ec" style="--c:var(--s)"><span class="t">Gemas</span><span class="v">+'+(5+(LS.bad===0?2:0))+' 💎</span></div></div><div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center">'+(nxt?'<button class="btn btn-p big" onclick="goNextLesson()">SIGUIENTE LECCIÓN →</button>':'')+'<button class="btn '+(nxt?'btn-ghost':'btn-p')+' big" onclick="lsNext()">VOLVER AL INICIO</button></div></div></div>';}
function goNextLesson(){const cid=LS.cid,nxt=nextAfter(cid,LS.lid);LS=null;$('#lesson-root').hidden=true;processPending();if(nxt)openLesson(cid,nxt);else render();}
function lsExit(){
 if(LS.finished){lsNext();return;}
 openModal('<img src="'+M_SAD+'" alt=""><h2>¿Te vas?</h2><p class="sub">Si sales ahora, perderás el progreso de esta sesión.</p><button class="btn btn-p w100" onclick="closeModal()">SEGUIR APRENDIENDO</button><button class="btn btn-err w100" style="margin-top:10px" onclick="closeModal();lsClose();">SALIR</button>');}
function lsClose(){stopTimer();LS=null;$('#lesson-root').hidden=true;saveU();render();processPending();}
function openHearts(){
 openModal('<img src="'+M_SAD+'" alt=""><h2>Te quedaste sin vidas.</h2><p class="sub">Respira: practicar también es aprender. Elige cómo continuar.</p><button class="btn btn-p w100" onclick="closeModal();startPractice(LS);">❤️ Practicar para recuperar</button>'+(U.gems>=30?'<button class="btn btn-ghost w100" style="margin-top:10px" onclick="useGemsHearts()">💎 Usar 30 gemas (tienes '+U.gems+')</button>':'')+'<button class="btn btn-err w100" style="margin-top:10px" onclick="closeModal();lsClose();">Salir de la lección</button>');}
function useGemsHearts(){U.gems-=30;U.hearts=5;saveU();closeModal();sGood();toast('❤️ Vidas restauradas.');LS.answered=false;LS.sel=null;LS.picks=[];renderLS();}
document.addEventListener('keydown',function(e){
 const tag=(document.activeElement&&document.activeElement.tagName)||'';
 if(tag==='TEXTAREA'||tag==='INPUT'){return;}
 if($('#lesson-root').hidden||!LS||!$('#modal-root').hidden)return;
 if(e.key==='Enter'){e.preventDefault();
  if(LS.finished){lsNext();return;}
  if(LS.step<0){lsStart();return;}
  if(LS.answered)lsNext();else{const cb=$('#lscheck');if(cb&&!cb.disabled)lsCheck();}
  return;}
 if(!LS.answered&&LS.step>=0&&['1','2','3','4'].includes(e.key)){
  const ex=LS.ex[LS.step];
  const max=ex.t==='tf'?2:(ex.o?ex.o.length:0);
  const i=+e.key-1;if(max&&i<max)lsSel(i);}});
window.addEventListener('error',function(e){
 const d=document.createElement('div');
 d.style.cssText='position:fixed;top:8px;left:8px;right:8px;z-index:999;color:#fca5a5;background:#1A2440;border:1px solid #EF4444;padding:10px;border-radius:10px;font:12px monospace;white-space:pre-wrap';
 d.textContent='Error: '+e.message;
 document.body.appendChild(d);});
loadU();
if(U){rollover();view=U.onb?'home':'onboarding';}
render();
setInterval(function(){if(U)saveU();},15000);
window.addEventListener('beforeunload',function(){if(U){stopTimer();saveU();}});
</script>
</body>
</html>
